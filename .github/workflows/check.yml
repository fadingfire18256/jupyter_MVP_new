name: Classroom checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classroom:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MOVIEAPP_MODE: demo
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TMDB_READ_ACCESS_TOKEN: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install classroom and verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check generated sources
        run: python build_modules.py --check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Execute all six notebooks in demo mode
        run: python tools/verify_notebooks.py --output .lesson-runs
      - name: Upload executed notebooks when a step fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lesson-runs
          path: .lesson-runs
          if-no-files-found: ignore
